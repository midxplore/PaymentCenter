<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="支付中心">
  <!-- 支付中心 系统标识：品牌蓝圆角方块 + 银行卡 + ¥
       纯矢量、不含文字节点（不依赖字体），16~32px 下仍可辨识。
       替换为自有品牌时，改这里与 Web/src/assets/logo.svg 两处（保持内容一致）。 -->
  <rect width="128" height="128" rx="30" fill="#0f59a4"/>
  <rect x="15" y="34" width="98" height="66" rx="10" fill="#ffffff"/>
  <rect x="15" y="46" width="98" height="9" fill="#0f59a4" opacity="0.85"/>
  <g stroke="#0f59a4" stroke-width="6.5" stroke-linecap="round" fill="none">
    <path d="M50 62 L64 78"/>
    <path d="M78 62 L64 78"/>
    <path d="M64 78 L64 96"/>
    <path d="M50 84 L78 84"/>
    <path d="M50 91 L78 91"/>
  </g>
</svg>
